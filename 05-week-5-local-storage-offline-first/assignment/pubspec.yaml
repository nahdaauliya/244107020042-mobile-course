name: offline_notes
description: "Offline-first notes app: SQLite via repository + Riverpod, cache-first read, dirty-flag sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + DI untuk seluruh akses storage.
  flutter_riverpod: ^3.4.3
  # Penyimpanan lokal terstruktur (catatan) - SQL penuh, index, transaksi.
  sqflite: ^2.4.4
  # join() untuk menyusun path file database di direktori dokumen.
  path: ^1.9.1
  # Preferensi kecil (tema gelap/terang, waktu terakhir dibuka).
  shared_preferences: ^2.5.5
  # Navigasi deklaratif: /, /editor/:id, /settings.
  go_router: ^16.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
