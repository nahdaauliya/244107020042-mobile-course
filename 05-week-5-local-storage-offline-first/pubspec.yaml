name: ai_challenge
description: "Offline-first notes app: SQLite (sqflite) + Riverpod + SharedPreferences, with dirty-flag sync and documented conflict rules."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + DI untuk seluruh lapis aplikasi.
  flutter_riverpod: ^3.4.3

  # Penyimpanan lokal terstruktur untuk catatan (tabel + indeks).
  sqflite: ^2.4.4
  path: ^1.9.1

  # Preferensi ringan: tema gelap/terang dan waktu terakhir dibuka.
  shared_preferences: ^2.5.5

  # Deteksi mode pesawat / kehilangan koneksi.
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true