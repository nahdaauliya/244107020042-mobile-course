
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: |
          pwd
          ls -la
          test -f pubspec.yaml

      - name: Install dependencies
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: flutter pub get

      - name: Check formatting
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: flutter test --coverage

      - name: Build APK
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: flutter build apk --release

      - name: Build AAB
        working-directory: 06-week-6-authentication-security-fcm/campus_notify
        run: flutter build appbundle --release

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            06-week-6-authentication-security-fcm/campus_notify/build/app/outputs/flutter-apk/app-release.apk
            06-week-6-authentication-security-fcm/campus_notify/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
